name: CampusCore CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campuscore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      E2E_LIVE_BACKEND: "1"
      APP_BASE_URL: http://localhost:3000
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: sms_audit_ci
      DB_TEST_NAME: sms_audit_ci
      DB_RESTORE_TEST_NAME: sms_audit_restore_v40
      STORAGE_DIR: /tmp/campuscore-ci-storage
      DB_APP_USER: root
      DB_APP_PASSWORD: campuscore_ci_test_password
      DB_MIGRATOR_USER: root
      DB_MIGRATOR_PASSWORD: campuscore_ci_test_password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: campuscore_ci_test_password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: sms_audit_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=campuscore_ci_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Migrate empty schema, roll back latest, and migrate again
        run: npm run db:migrate:audit-test --workspace=backend
      - name: Provision isolated restore scratch schema
        run: npm run db:provision:audit-scratch --workspace=backend
      - name: Seed and verify browser authentication against MySQL
        run: npm run test:auth-e2e --workspace=backend
      - name: Run frontend browser, authentication, and accessibility checks
        run: npm run test:e2e --workspace=frontend
      - name: Run full test suite against MySQL 8.4 (pass 1)
        run: npm test
      - name: Repeat full test suite against MySQL 8.4 (pass 2)
        run: npm test
      - name: Run shuffled full test suite against MySQL 8.4
        run: npm exec --workspace=backend -- vitest run --sequence.shuffle --sequence.seed=20261123

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
